PLG_SYSTEM_STORELINKR="System - HikaShop StoreLinkr Connector"
PLG_SYSTEM_STORELINKR_XML_DESCRIPTION="Connects HikaShop to StoreLinkr: StoreLinkr sends your catalogue, prices, stock and images to the shop and reads its orders back."
PLG_SYSTEM_STORELINKR_ENDPOINT="Connecting StoreLinkr"
PLG_SYSTEM_STORELINKR_ENDPOINT_DESC="In StoreLinkr, add a HikaShop integration with your site's address as its domain, then enter the same API key and API secret as below. StoreLinkr calls your site under /storelinkr/v1/."
PLG_SYSTEM_STORELINKR_API_KEY="API key"
PLG_SYSTEM_STORELINKR_API_KEY_DESC="The key StoreLinkr sends with every call. Choose a long random value and enter the same one in StoreLinkr. Nothing is accepted while it is empty."
PLG_SYSTEM_STORELINKR_API_SECRET="API secret"
PLG_SYSTEM_STORELINKR_API_SECRET_DESC="The secret StoreLinkr sends with every call. Choose a long random value and enter the same one in StoreLinkr. Nothing is accepted while it is empty."
PLG_SYSTEM_STORELINKR_IMPORT_SOURCE="Import source"
PLG_SYSTEM_STORELINKR_IMPORT_SOURCE_DESC="The label stored on the records StoreLinkr creates. Leave it at storelinkr unless StoreLinkr asks otherwise."
PLG_SYSTEM_STORELINKR_DEFAULT_CURRENCY="Currency id"
PLG_SYSTEM_STORELINKR_DEFAULT_CURRENCY_DESC="The id of the HikaShop currency of the prices StoreLinkr sends. Leave it empty to use the shop's main currency."
PLG_SYSTEM_STORELINKR_ORDER_STATUS="Status of orders from StoreLinkr"
PLG_SYSTEM_STORELINKR_ORDER_STATUS_DESC="The order status given to the orders StoreLinkr creates, for example created or confirmed."
PLG_SYSTEM_STORELINKR_PUBLISH_NEW="Publish new products"
PLG_SYSTEM_STORELINKR_PUBLISH_NEW_DESC="Publish the products StoreLinkr creates at once. Turn it off to review them before they show in the shop."
PLG_SYSTEM_STORELINKR_IMG_ALLOWLIST="Image hosts"
PLG_SYSTEM_STORELINKR_IMG_ALLOWLIST_DESC="Optional: one host name per line. When set, images are only downloaded from these hosts. Images are never downloaded from private or local addresses."
